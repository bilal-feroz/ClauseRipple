# ClauseRipple local infrastructure.
#   FalkorDB          -> localhost:6379
#   FalkorDB Browser  -> http://localhost:3001  (bundled in the falkordb/falkordb image)
#   API (optional)    -> http://localhost:8000  (docker compose --profile full up)
#   Web (optional)    -> http://localhost:3000  (docker compose --profile full up)
name: clauseripple

services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    container_name: clauseripple-falkordb
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "3001:3000" # FalkorDB Browser (container port 3000 -> host 3001, keeps 3000 free for the web app)
    environment:
      BROWSER: "1"
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 10000 RESULTSET_SIZE 10000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clauseripple-api
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      CORS_ORIGINS: http://localhost:3000
      AUTO_SEED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"

  web:
    profiles: ["full"]
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: clauseripple-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  falkordb-data:
