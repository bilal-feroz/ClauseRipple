name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff + pytest on real FalkorDB)
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports: ["6379:6379"]
        env:
          BROWSER: "0"
          FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 10000 RESULTSET_SIZE 10000"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
        env:
          FALKORDB_HOST: localhost
          DISABLE_EMBEDDINGS: "true"
          LLM_PROVIDER: ""

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
